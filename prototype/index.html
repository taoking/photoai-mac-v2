<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoAI v2 原型</title>
<style>
:root{
  --bg:#f5f5f7; --panel:#ffffff; --side:#ececef; --line:#d9d9de; --text:#1d1d1f; --sub:#6e6e73;
  --accent:#0a66ff; --accent-weak:rgba(10,102,255,.14); --hover:rgba(0,0,0,.05);
  --warn:#d97706; --danger:#d92d20; --ok:#16a34a; --chip:#e8e8ed; --shadow:0 12px 40px rgba(0,0,0,.22);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1e1e20; --panel:#262628; --side:#2c2c2f; --line:#3a3a3e; --text:#f2f2f4; --sub:#9a9aa1;
    --accent:#3b82ff; --accent-weak:rgba(59,130,255,.22); --hover:rgba(255,255,255,.06);
    --chip:#3a3a3e; --shadow:0 12px 40px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--sub)}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}

/* 菜单栏 */
#menubar{height:26px;display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--side);border-bottom:1px solid var(--line);user-select:none}
#menubar .m{position:relative;padding:2px 9px;border-radius:4px;cursor:default}
#menubar .m:hover,#menubar .m.open{background:var(--hover)}
#menubar .m b{font-weight:600}
#menubar .drop{display:none;position:absolute;top:24px;left:0;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;z-index:50}
#menubar .m.open .drop{display:block}
.drop .it{display:flex;justify-content:space-between;gap:20px;padding:4px 10px;border-radius:5px;cursor:default;white-space:nowrap}
.drop .it:hover{background:var(--accent);color:#fff}
.drop .it:hover .muted{color:#fff}
.drop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#menubar .proto{margin-left:auto;color:var(--sub);font-size:12px}

#app{display:flex;height:calc(100% - 26px - 26px)}
/* 侧栏 */
#sidebar{width:228px;flex:none;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:8px 6px 20px;user-select:none}
.sec{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:var(--sub);padding:0 8px 3px}
.sec-h .add{cursor:pointer;font-size:14px;line-height:1;padding:0 4px;border-radius:4px}
.sec-h .add:hover{background:var(--hover)}
.row{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;cursor:default;white-space:nowrap}
.row:hover{background:var(--hover)}
.row.on{background:var(--accent-weak)}
.row .n{margin-left:auto;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums}
.row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .tw{width:12px;color:var(--sub);flex:none;text-align:center}
.row.l2{padding-left:22px}.row.l3{padding-left:40px}
.dot.online{background:var(--ok)}.dot.offline{border:1.5px solid var(--sub)}

/* 主区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
#search{flex:0 1 260px;min-width:110px}
#toolbar button,#toolbar select,#toolbar .seg{white-space:nowrap;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;cursor:pointer}
.seg button.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
#toolbar .sp{flex:1}
/* 标题行：一行 34px，卷信息、筛选摘要、计数、更多操作都在这一行 */
#head{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;height:36px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
#head h1{font-size:15px;margin:0;font-weight:650;overflow:hidden;text-overflow:ellipsis}
#head .meta{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:5px}
#head .warn{color:var(--warn);font-weight:600;cursor:pointer;font-size:12px}
#head .warn:hover{text-decoration:underline}
#head .count{margin-left:auto;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
#head .more{border:0;background:transparent;cursor:pointer;border-radius:5px;padding:2px 7px;font-size:15px;line-height:1}
#head .more:hover{background:var(--hover)}
.fsum{display:inline-flex;align-items:center;gap:4px;background:var(--accent-weak);color:var(--accent);border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer}
.fsum .x{opacity:.7}.fsum .x:hover{opacity:1}
#chips{display:none}
#fbBtn .n{background:var(--accent);color:#fff;border-radius:8px;padding:0 5px;font-size:11px;margin-left:3px}
#fbBtn.on{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
/* 单张、比较：标题行和筛选条都收起，画面留给照片 */
#main.immersive #head,#main.immersive #filterbar{display:none}
body.focusmode #sidebar,body.focusmode #inspector,body.focusmode #toolbar,body.focusmode #checklist{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:12px;padding:2px 9px;font-size:12px}
.chip .x{cursor:pointer;opacity:.6}.chip .x:hover{opacity:1}
#filterbar{display:flex;align-items:center;gap:4px;padding:4px 16px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.fb-group{display:inline-flex;align-items:center;gap:3px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line);flex:none}
.fb-group:last-child{border-right:0}
.f{border:1px solid var(--line);background:transparent;border-radius:12px;padding:1px 9px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.f:hover{background:var(--hover)}
.f.on{background:var(--accent);border-color:var(--accent);color:#fff}
.f .sw{width:9px;height:9px;border-radius:50%}
.fb-count{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.stalebtn{border-color:var(--warn);color:var(--warn)}
#content{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow:auto}
.hidden{display:none!important}

/* 网格 */
#grid{padding:6px 14px 40px}
.day-h{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 2px 6px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.day-h .muted{font-weight:400}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{position:relative;flex:none;cursor:default;border-radius:6px;padding:3px;border:2px solid transparent}
.cell.sel{border-color:var(--accent);background:var(--accent-weak)}
.cell.focus{outline:2px dashed var(--accent);outline-offset:1px}
.cell.stale .ph{opacity:.45}
.cell .ph{width:100%;border-radius:4px;position:relative;overflow:hidden}
.cell .cap{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}
.b{position:absolute;font-size:11px;line-height:1;border-radius:9px;padding:3px 6px;background:rgba(0,0,0,.5);color:#fff}
.b.stars{top:6px;left:6px;color:#ffd60a}
.b.flag{top:6px;right:6px}
.b.flag.pick{background:var(--ok)}.b.flag.reject{background:var(--danger)}
.b.kind{bottom:6px;right:6px;font-size:10px}
.b.offline{bottom:6px;left:6px;background:rgba(217,119,6,.85)}
.b.stale{top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(0,0,0,.7)}
.ldots{position:absolute;left:6px;bottom:6px;display:flex;gap:3px}
.ldots i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);display:block}
.cell .ph.pending{background:repeating-linear-gradient(45deg,var(--chip) 0 8px,var(--panel) 8px 16px)!important}
.cell .ph.pending::after{content:"生成预览中";position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:11px}

/* 单张：没有顶部栏，信息条浮在画面底部，鼠标不动 2 秒后淡出 */
#single{display:flex;flex-direction:column;overflow:hidden}
.s-head{display:flex;align-items:center;gap:12px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px}
.sbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:rgba(20,20,22,.78);color:#fff;border-radius:10px;padding:5px 8px 5px 6px;z-index:4;white-space:nowrap;
  opacity:0;transition:opacity .25s;backdrop-filter:blur(8px)}
.stage.show .sbar,.sbar:hover{opacity:1}
.sbar .btn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff;padding:1px 8px}
.sbar .muted{color:rgba(255,255,255,.65)}
.sbar .stars span{cursor:pointer;font-size:15px;color:rgba(255,255,255,.4)}
.sbar .stars span.on{color:#f5a524}
.sbar .lc{display:inline-flex;align-items:center;gap:3px;font-size:12px}
.sbar .lc i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sbar .fl{border-radius:8px;padding:0 6px;font-size:11px}
.stage{flex:1;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg)}
.stage .img{border-radius:3px;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .15s;position:relative}
.stage .img.zoom{transform:scale(2)}
.zoomnote{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;z-index:3}
.infoov{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;z-index:3;line-height:1.6}
.film{height:78px;flex:none;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--line)}
.film .ft{flex:none;height:60px;border-radius:3px;border:2px solid transparent;cursor:pointer;position:relative}
.film .ft.on{border-color:var(--accent)}
.film .ft .fs{position:absolute;left:2px;bottom:1px;font-size:9px;color:#ffd60a;text-shadow:0 0 2px #000}

/* 比较 */
#compare{display:flex;flex-direction:column;overflow:hidden}
.cmp{flex:1;display:grid;gap:8px;padding:8px;background:var(--bg);min-height:0}
.cmp .cc{position:relative;display:grid;place-items:center;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--panel)}
.cmp .cc.on{border-color:var(--accent)}
.cmp .cc .meta{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:6px;padding:3px 8px;z-index:2}

/* 存根页 */
#stub{padding:24px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.pcard{text-align:center;cursor:pointer;padding:8px;border-radius:8px}
.pcard:hover{background:var(--hover)}
.pcard .face{width:96px;height:96px;border-radius:50%;margin:0 auto 6px}

/* 检查器 */
#inspector{width:290px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:12px 14px;background:var(--panel)}
#inspector h3{font-size:11px;color:var(--sub);margin:16px 0 6px;font-weight:600}
#inspector .thumb{width:100%;border-radius:6px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:3px 8px;font-size:12px}
.kv div:nth-child(odd){color:var(--sub)}
.istars span{cursor:pointer;font-size:18px;color:var(--sub)}
.istars span.on{color:#f5a524}
.lchips{display:flex;flex-wrap:wrap;gap:4px}
.loc{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.loc .p{color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 状态栏 */
#statusbar{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);background:var(--side);font-size:12px;color:var(--sub)}
#statusbar .tasks{display:flex;gap:12px;align-items:center;color:var(--text)}
#statusbar .bar{width:80px;height:5px;border-radius:3px;background:var(--chip);overflow:hidden;display:inline-block;vertical-align:middle}
#statusbar .bar i{display:block;height:100%;background:var(--accent)}
#statusbar .sp{flex:1}
.aa.on{color:var(--accent);font-weight:600}

/* 弹层 */
#modal-root .back{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:100}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column}
.modal.wide{width:min(980px,94vw)}
.modal .mh{padding:14px 18px 6px;font-weight:600;font-size:15px}
.modal .mb{padding:6px 18px 10px;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line)}
.modal .mf .left{margin-right:auto}
.opt{display:flex;gap:8px;align-items:center;padding:3px 0}
.fieldset{margin:8px 0 12px}
.fieldset .t{font-weight:600;margin-bottom:4px}
.minigrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.minigrid .mc{height:54px;border-radius:3px;position:relative;cursor:default;border:2px solid transparent}
.minigrid .mc.sel{border-color:var(--accent)}
.minigrid .mc .b{font-size:9px;padding:2px 4px}
.ogroup{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.ogroup .oh{display:flex;align-items:center;gap:8px}
.collrow{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer}
.collrow:hover{background:var(--hover)}
.collrow.last{background:var(--accent-weak)}
table.keys{border-collapse:collapse;width:100%}
table.keys td{padding:3px 6px;border-bottom:1px solid var(--line)}
table.keys td:first-child{white-space:nowrap;width:110px}
.labelrow{display:flex;gap:8px;align-items:center;margin:4px 0}
.labelrow .sw{width:20px;height:20px;border-radius:50%;cursor:pointer;flex:none}

#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:200;pointer-events:none}
#toast div{background:rgba(30,30,32,.92);color:#fff;border-radius:8px;padding:7px 14px;font-size:12px;box-shadow:var(--shadow)}
#banner{position:fixed;top:36px;right:16px;z-index:90}
#banner .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;width:300px}
#ctx{position:fixed;z-index:150;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;min-width:200px}
#ctx .it{padding:4px 10px;border-radius:5px;cursor:default;display:flex;justify-content:space-between;gap:16px}
#ctx .it:hover{background:var(--accent);color:#fff}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

#checklist{position:fixed;right:16px;bottom:38px;z-index:80;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);font-size:12px}
#checklist .ch{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;font-weight:600}
#checklist .cb{padding:0 12px 10px}
#checklist label{display:flex;gap:6px;padding:2px 0;align-items:flex-start}
#checklist.min .cb{display:none}
</style>
</head>
<body>
<div id="menubar"></div>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main">
    <div id="toolbar">
      <input id="search" placeholder="搜索：DSC01926、1926-1950、2026-08、经典、地名、相机…（回车）">
      <select id="sort" title="排序">
        <option value="timeDesc">拍摄时间 新→旧</option>
        <option value="timeAsc">拍摄时间 旧→新</option>
        <option value="name">文件名</option>
      </select>
      <div class="seg" id="viewseg">
        <button data-v="grid" title="网格（空格切换）">▦ 网格</button>
        <button data-v="single" title="单张（空格）">▢ 单张</button>
        <button data-v="compare" title="比较（C）">◫ 比较</button>
      </div>
      <input id="size" type="range" min="90" max="280" value="150" title="缩略图大小" style="width:110px">
      <div class="sp"></div>
      <button class="btn" id="fbBtn" title="显示 / 隐藏筛选条（\）">筛选</button>
      <button class="btn" id="exportBtn" title="导出（⌘E）">导出…</button>
      <button class="btn" id="inspBtn" title="显示 / 隐藏检查器">ⓘ 检查器</button>
    </div>
    <div id="head"></div>
    <div id="chips"></div>
    <div id="filterbar"></div>
    <div id="content">
      <div id="grid" class="view"></div>
      <div id="single" class="view hidden"></div>
      <div id="compare" class="view hidden"></div>
      <div id="stub" class="view hidden"></div>
    </div>
  </main>
  <aside id="inspector"></aside>
</div>
<div id="statusbar"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="banner"></div>
<div id="ctx"></div>
<div id="checklist"></div>

<script>
'use strict';
/* =========================================================================
   PhotoAI v2 可点击原型
   只模拟界面和交互：照片是生成的色块，数据只在内存里，刷新页面即重置。
   设计依据：docs/设计稿.md、docs/信息架构与交互.md
   ========================================================================= */

// ---------- 小工具 ----------
let seed = 20261119;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const pick = a => a[Math.floor(rnd() * a.length)];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WEEK = '日一二三四五六';
const DAY = 86400000;
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function dayTitle(ts) { const d = new Date(ts); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 · 星期${WEEK[d.getDay()]}`; }
function timeStr(ts) { const d = new Date(ts); return `${dayKey(ts)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`; }
function toast(msg) {
  const el = document.createElement('div'); el.textContent = msg; $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ---------- 模拟数据 ----------
const LABEL_PALETTE = ['#e5484d', '#f5a524', '#30a46c', '#3e63dd', '#8e4ec6', '#12a594', '#e93d82', '#ad7f58', '#8b8d98'];
const labels = [
  { id: 1, name: '经典', color: '#e5484d' }, { id: 2, name: '人像', color: '#f5a524' },
  { id: 3, name: '风景', color: '#30a46c' }, { id: 4, name: '人文', color: '#3e63dd' },
  { id: 5, name: '', color: '#8e4ec6' }, { id: 6, name: '', color: '#12a594' },
  { id: 7, name: '', color: '#e93d82' }, { id: 8, name: '', color: '#ad7f58' }, { id: 9, name: '', color: '#8b8d98' },
];
const labelById = id => labels.find(l => l.id === id);

const volumes = [
  { id: 'A', name: '卡 A 128G', kind: 'card', online: true, status: 'active', capacity: '128 GB', root: 'DCIM', lastScan: '今天 14:02' },
  { id: 'BK', name: '备份盘 2', kind: 'disk', online: true, status: 'active', capacity: '4 TB', root: '照片', lastScan: '昨天 21:40' },
  { id: 'B', name: '卡 B 64G', kind: 'card', online: false, status: 'active', capacity: '64 GB', root: 'DCIM', lastScan: '11月2日' },
  { id: 'C', name: '旧卡 C', kind: 'card', online: false, status: 'active', capacity: '32 GB', root: 'DCIM', lastScan: '2025年12月1日' },

const LENSES = ['FE 24-70mm F2.8 GM II', 'FE 70-200mm F2.8 GM II', 'FE 35mm F1.4 GM', 'FE 16-35mm F4 G'];
const PEOPLE = ['小王', '阿杰', '妈妈', '林林'];
const photos = [];
const P = {};
let nextId = 1;
let batchSeq = 1;

function genTrip({ vol, count, start, days, places, startNo, hues, batch, trip }) {
  const startTs = new Date(start + 'T08:00:00').getTime();
  const perDay = Math.ceil(count / days);
  const list = [];
  for (let i = 0; i < count; i++) {
    const dayIdx = Math.floor(i / perDay);
    const k = i % perDay;
    const ts = startTs + dayIdx * DAY + Math.floor(k * (11 * 3600000 / perDay)) + Math.floor(rnd() * 40000);
    const portrait = rnd() < 0.27;
    const r = rnd();
    const kind = r < 0.55 ? 'RAW+JPG' : r < 0.9 ? 'JPG' : 'RAW';
    const no = startNo + i;
    const name = 'DSC' + String(no).padStart(5, '0');
    const folder = `DCIM/${100 + Math.floor(no / 1000) % 900}MSDCF`;
    const h1 = pick(hues) + Math.floor(rnd() * 30) - 15;
    const p = {
      id: nextId++, name, no, kind, ts, w: portrait ? 2 : 3, h: portrait ? 3 : 2, portrait,
      h1, h2: (h1 + 40 + Math.floor(rnd() * 140)) % 360, light: 55 + Math.floor(rnd() * 25),
      camera: 'Sony A7M4', lens: pick(LENSES), iso: pick([100, 200, 400, 800, 1600, 3200]),
      aperture: pick(['f/1.8', 'f/2.8', 'f/4', 'f/5.6', 'f/8', 'f/11']),
      shutter: pick(['1/2000', '1/1000', '1/500', '1/250', '1/125', '1/60']), focal: pick(['24mm', '35mm', '50mm', '70mm', '135mm', '200mm']),
      place: pick(places), trip,
      people: portrait && rnd() < 0.6 ? [pick(PEOPLE)] : (rnd() < 0.05 ? [pick(PEOPLE)] : []),
      rating: 0, flag: 'none', labels: new Set(), batch, preview: 'done',
      locations: [{ vol, path: `${volById(vol).root === 'DCIM' ? folder : volById(vol).root + '/' + trip}/${name}`, status: vol === 'D' ? 'historical' : 'present' }],
    };
    photos.push(p); P[p.id] = p; list.push(p);
  }
  return list;
}

const tripC = genTrip({ vol: 'C', count: 120, start: '2025-11-08', days: 3, places: ['杭州 · 西湖', '杭州 · 灵隐寺'], startNo: 2100, hues: [30, 200, 120], batch: batchSeq++, trip: '2025-11 杭州' });

const tripD = genTrip({ vol: 'D', count: 50, start: '2026-06-14', days: 2, places: ['上海 · 外滩', '上海 · 武康路'], startNo: 6100, hues: [20, 260], batch: batchSeq++, trip: '2026-06 上海' });
const tripA = genTrip({ vol: 'A', count: 700, start: '2026-08-10', days: 8, places: ['乌鲁木齐', '喀纳斯', '禾木', '赛里木湖', '独库公路'], startNo: 1500, hues: [200, 40, 100, 25], batch: batchSeq++, trip: '2026-08 新疆' });
const tripB = genTrip({ vol: 'B', count: 260, start: '2026-10-03', days: 4, places: ['东京 · 浅草', '东京 · 涩谷', '镰仓'], startNo: 8800, hues: [330, 10, 220], batch: batchSeq++, trip: '2026-10 东京' });

// 备份盘 2 上还有：新疆前 450 张、旧卡 C 的前 60 张、卡 D 的前 20 张。
// 其中 40 张 RAW+JPG 在备份盘上只有 JPG：按照片看“有副本”，按文件看 RAW 只在卡上。
let jpgOnly = 0;
tripA.slice(0, 450).forEach(p => {

  p.locations.push({ vol: 'BK', path: `照片/2026-08 新疆/${p.name}`, status: 'present', ...(partial ? { parts: ['JPG'] } : {}) });
});
tripC.slice(0, 60).forEach(p => p.locations.push({ vol: 'BK', path: `照片/2025-11 杭州/${p.name}`, status: 'present' }));
tripD.slice(0, 20).forEach(p => p.locations.push({ vol: 'BK', path: `照片/2026-06 上海/${p.name}`, status: 'present' }));

// 云南和杭州是以前选过的：带一些星级、标签与标记。
[...tripY, ...tripC, ...tripD].forEach(p => {
  const r = rnd();
  p.rating = r < 0.35 ? 0 : r < 0.55 ? 2 : r < 0.75 ? 3 : r < 0.9 ? 4 : 5;
  if (rnd() < 0.25) p.labels.add(p.portrait ? 2 : 3);
  if (p.rating === 5 && rnd() < 0.6) p.labels.add(1);
  if (rnd() < 0.12) p.flag = 'reject'; else if (p.rating >= 4 && rnd() < 0.5) p.flag = 'pick';
});
let collSeq = 1;
const collections = [
  { id: collSeq++, name: '云南 · 精选', ids: new Set(tripY.filter(p => p.rating === 5).map(p => p.id)) },
  { id: collSeq++, name: '家人', ids: new Set(photos.filter(p => p.people.includes('妈妈')).slice(0, 40).map(p => p.id)) },
];
const collById = id => collections.find(c => c.id === id);

// ---------- 规则 ----------
// 可见 ⇔ 至少一个现存位置，且所在卷没被移除（离线也算）。
const isPresent = l => l.status === 'present' && volById(l.vol).status === 'active';
const visible = p => p.locations.some(isPresent);
const presentLocs = p => p.locations.filter(isPresent);
const isOnline = p => presentLocs(p).some(l => volById(l.vol).online);
// 副本按文件算：RAW 和 JPEG 各是一个文件。位置可以只含其中一部分（比如备份盘上只有 JPG）。
const partsOf = p => p.kind === 'RAW+JPG' ? ['RAW', 'JPG'] : [p.kind];
const locParts = (l, p) => l.parts || partsOf(p);
// 卡上有、但别处没有现存副本的文件。
function missingParts(p, volId) {
  const here = new Set(p.locations.filter(l => l.vol === volId && isPresent(l)).flatMap(l => locParts(l, p)));
  const elsewhere = new Set(p.locations.filter(l => l.vol !== volId && isPresent(l)).flatMap(l => locParts(l, p)));
  return [...here].filter(k => !elsewhere.has(k));
}
// 整张照片在别处一个现存位置都没有：移除这个卷后它会进入“无卷关联照片”。
function noOtherCopy(p, volId) { return !p.locations.some(l => isPresent(l) && l.vol !== volId); }
const partName = k => k === 'RAW' ? 'RAW' : 'JPEG';
function inAnyColl(p) { return collections.some(c => c.ids.has(p.id)); }

// ---------- 状态 ----------
const S = {
  source: { type: 'vol', id: 'A' }, view: 'grid', sort: 'timeDesc', rowH: 150, inspector: true,
  sel: new Set(), focus: null, anchor: null,
  filters: {}, result: [], lastColl: null, undo: [], redo: [], autoAdvance: false,
  expandedYears: new Set([2026]), expandedMonths: new Set(['2026-08']),
  zoom: false, info: false, cmpFocus: 0, search: null, tasks: null,
  filterbarOpen: true, focusMode: false,
};
const srcKey = s => s.type + ':' + (s.id ?? '');
const emptyFilter = () => ({ starMode: 'gte', stars: new Set(), labels: new Set(), noLabel: false, flags: new Set(), kinds: new Set() });
function curFilter() { const k = srcKey(S.source); return S.filters[k] || (S.filters[k] = emptyFilter()); }

function sourcePhotos(src) {
  const vis = photos.filter(visible);
  switch (src.type) {
    case 'all': return vis;
    case 'recent': { const b = Math.max(...vis.map(p => p.batch)); return vis.filter(p => p.batch === b); }
    case 'year': return vis.filter(p => new Date(p.ts).getFullYear() === src.id);
    case 'month': return vis.filter(p => dayKey(p.ts).startsWith(src.id));
    case 'day': return vis.filter(p => dayKey(p.ts) === src.id);
    case 'vol': return vis.filter(p => p.locations.some(l => l.vol === src.id && isPresent(l)));
    case 'coll': { const c = collById(src.id); return c ? vis.filter(p => c.ids.has(p.id)) : []; }
    case 'person': return vis.filter(p => p.people.includes(src.id));
    case 'place': return vis.filter(p => p.place === src.id);
    case 'search': return vis.filter(p => (S.search || []).every(t => t.test(p)));
    default: return [];
  }
}
function matches(p, f) {
  if (f.stars.size) {
    if (f.starMode === 'gte') { if (p.rating < [...f.stars][0]) return false; }
    else if (!f.stars.has(p.rating)) return false;
  }
  if (f.labels.size || f.noLabel) {
    const okL = [...f.labels].some(id => p.labels.has(id)) || (f.noLabel && p.labels.size === 0);
    if (!okL) return false;
  }
  if (f.flags.size && !f.flags.has(p.flag)) return false;
  if (f.kinds.size && !f.kinds.has(p.kind)) return false;
  return true;
}
function sortList(list) {
  const s = S.sort;
  return list.sort((a, b) => s === 'timeAsc' ? a.ts - b.ts : s === 'timeDesc' ? b.ts - a.ts : a.name.localeCompare(b.name));
}
// 重新筛选。打星、打标签时不调用它：结果保持不变，直到用户点“刷新结果”或改条件。
function recompute(keepSel = true) {
  const f = curFilter();
  S.result = sortList(sourcePhotos(S.source).filter(p => matches(p, f))).map(p => p.id);
  const inRes = new Set(S.result);
  if (keepSel) { S.sel = new Set([...S.sel].filter(id => inRes.has(id))); }
  else S.sel = new Set();
  if (!inRes.has(S.focus)) S.focus = S.result[0] ?? null;
  if (S.sel.size === 0 && S.focus != null) S.sel.add(S.focus);
  S.anchor = S.focus;
}
const staleCount = () => { const f = curFilter(); return S.result.filter(id => P[id] && !matches(P[id], f)).length; };

// ---------- 照片外观（色块代替照片） ----------
function phStyle(p) {
  const L = p.light;
  const base = `linear-gradient(180deg, hsl(${p.h1} 55% ${L + 12}%) 0%, hsl(${p.h1} 45% ${L}%) 46%, hsl(${p.h2} 35% ${L - 20}%) 54%, hsl(${p.h2} 30% ${L - 38}%) 100%)`;
  return p.portrait ? `radial-gradient(ellipse 16% 12% at 50% 36%, hsl(${p.h2} 35% ${L - 5}%) 0 98%, transparent 100%), radial-gradient(ellipse 26% 30% at 50% 72%, hsl(${p.h2} 30% ${L - 25}%) 0 98%, transparent 100%), ${base}` : base;
}
function badges(p, small) {
  let h = '';
  if (p.rating) h += `<span class="b stars">${'★'.repeat(p.rating)}</span>`;
  if (p.flag !== 'none') h += `<span class="b flag ${p.flag}">${p.flag === 'pick' ? 'Pick' : 'Reject'}</span>`;
  if (!small && p.kind === 'RAW+JPG') h += `<span class="b kind">RAW+JPG</span>`;
  if (p.labels.size) h += `<span class="ldots">${[...p.labels].map(id => `<i style="background:${labelById(id).color}"></i>`).join('')}</span>`;
  else if (!small && !isOnline(p)) h += `<span class="b offline" title="所在卷离线，显示的是本机预览">离线</span>`;
  return h;
}

// ---------- 侧栏 ----------
function renderSidebar() {
  const vis = photos.filter(visible);
  const cur = srcKey(S.source);
  const row = (type, id, label, n, extra = '', cls = '') =>
    `<div class="row ${cls} ${cur === type + ':' + (id ?? '') ? 'on' : ''}" data-type="${type}" data-id="${id ?? ''}">${extra}<span>${esc(label)}</span>${n != null ? `<span class="n">${n.toLocaleString()}</span>` : ''}</div>`;
  let h = `<div class="sec"><div class="sec-h">图库</div>${row('all', null, '全部照片', vis.length, '🖼')}${row('recent', null, '最近导入', sourcePhotos({ type: 'recent' }).length, '🕘')}</div>`;
  // 时间：年 → 月 → 日
  const years = {};
  vis.forEach(p => { const d = new Date(p.ts); const y = d.getFullYear(); const m = dayKey(p.ts).slice(0, 7); const dk = dayKey(p.ts);
    years[y] ??= { n: 0, months: {} }; years[y].n++; years[y].months[m] ??= { n: 0, days: {} }; years[y].months[m].n++; years[y].months[m].days[dk] = (years[y].months[m].days[dk] || 0) + 1; });

    if (!yo) return;
    Object.keys(Y.months).sort().reverse().forEach(m => {

  collections.forEach(c => { h += row('coll', c.id, c.name, vis.filter(p => c.ids.has(p.id)).length, '📁'); });
  h += `</div><div class="sec"><div class="sec-h">人物</div>${row('people', null, '全部人物', null, '👤')}</div>`;
  h += `<div class="sec"><div class="sec-h">地点</div>${row('places', null, '全部地点', null, '📍')}</div>`;

// ---------- 头部、筛选条 ----------
function sourceTitle(src = S.source) {

// 当前生效的筛选条件，一句话概括。筛选条收起时显示在标题行，保证“有筛选在生效”始终看得见。
function filterSummary(f = curFilter()) {

}
function activeFilterCount(f = curFilter()) { return (f.stars.size ? 1 : 0) + (f.labels.size || f.noLabel ? 1 : 0) + (f.flags.size ? 1 : 0) + (f.kinds.size ? 1 : 0); }
// 标题行只有一行：标题、卷状态、无副本提醒、搜索条件、筛选摘要、计数、“⋯”更多操作。

// 在线 / 离线只看卷有没有挂载（按卷 UUID 对上），不逐个检查原片。

$('#filterbar').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  const f = curFilter(); const v = b.dataset.v;
  if (b.dataset.f === 'more') {
    const r = b.getBoundingClientRect();
    const tick = on => on ? '✓ ' : '　 ';
    const apply = fn => () => { fn(); recompute(); renderAll(); renderGrid(); renderView(); };
    showCtx({ clientX: r.left, clientY: r.bottom + 4 }, [
      ...['RAW+JPG', 'JPG', 'RAW'].map(k => [tick(f.kinds.has(k)) + k, apply(() => f.kinds.has(k) ? f.kinds.delete(k) : f.kinds.add(k))]),
      null, [tick(f.noLabel) + '无标签', apply(() => f.noLabel = !f.noLabel)],
    ]);
    return;
  }
  switch (b.dataset.f) {
    case 'starMode': f.starMode = f.starMode === 'gte' ? 'eq' : 'gte'; f.stars.clear(); break;
    case 'star': { const n = +v; if (f.starMode === 'gte') { const had = f.stars.has(n); f.stars.clear(); if (!had) f.stars.add(n); } else f.stars.has(n) ? f.stars.delete(n) : f.stars.add(n); break; }
    case 'label': { const n = +v; f.labels.has(n) ? f.labels.delete(n) : f.labels.add(n); break; }
    case 'noLabel': f.noLabel = !f.noLabel; break;
    case 'flag': f.flags.has(v) ? f.flags.delete(v) : f.flags.add(v); break;
    case 'kind': f.kinds.has(v) ? f.kinds.delete(v) : f.kinds.add(v); break;
    case 'clear': S.filters[srcKey(S.source)] = emptyFilter(); break;
    case 'refresh': break;
  }
  recompute(); renderAll(); renderGrid(); renderView();
});

    <div class="ph ${p.preview === 'pending' ? 'pending' : ''}" style="height:${S.rowH}px;background:${phStyle(p)}">${badges(p)}${stale ? '<span class="b stale">已不符合筛选</span>' : ''}</div>
    <div class="cap">${p.name}${p.kind === 'RAW+JPG' ? '' : '.' + (p.kind === 'RAW' ? 'ARW' : 'JPG')}</div></div>`;
}
function renderGrid() {
  if (isStubSource()) return;
  const byTime = S.sort !== 'name';
  let h = ''; let lastDay = null; let open = false; let dayCount = {};
  if (byTime) S.result.forEach(id => { const k = dayKey(P[id].ts); dayCount[k] = (dayCount[k] || 0) + 1; });
  if (!S.result.length) h = `<div class="muted" style="padding:40px;text-align:center">没有符合条件的照片。</div>`;
  S.result.forEach(id => {
    const p = P[id];
    if (byTime) {
      const k = dayKey(p.ts);
      if (k !== lastDay) { if (open) h += '</div>'; h += `<div class="day-h">${dayTitle(p.ts)}<span class="muted">${dayCount[k]} 张</span></div><div class="cells">`; open = true; lastDay = k; }
    } else if (!open) { h += '<div class="cells" style="padding-top:8px">'; open = true; }
    h += cellHTML(p);

}
function patchCell(id) {

}
function syncSelClasses() {

function scrollFocusIntoView() {

}
gridEl.addEventListener('mousedown', e => {
  const c = e.target.closest('.cell'); if (!c || e.button !== 0) return;

function gridNeighbor(dir) {
  const cells = [...gridEl.querySelectorAll('.cell')];
  const cur = cells.find(c => +c.dataset.id === S.focus); if (!cur) return null;
  const r = cur.getBoundingClientRect(); const cx = r.left + r.width / 2;
  let best = null, bs = Infinity;
  for (const c of cells) {
    const q = c.getBoundingClientRect();
    const dy = dir > 0 ? q.top - r.top : r.top - q.top;
    if (dy < 5) continue;
    const score = Math.round(dy) * 10000 + Math.abs(q.left + q.width / 2 - cx);
    if (score < bs) { bs = score; best = c; }
  }
  return best ? +best.dataset.id : null;
}

function zoomNote(p, online, needVol) {

S.barUntil = Date.now() + 2500;
let barTimer = null;
function pokeBar() { S.barUntil = Date.now() + 2000; document.querySelector('#single .stage')?.classList.add('show'); scheduleBarHide(); }

function layoutStage(stage, img, p, pad = 40) {

  let w = W, h = W / r; if (h > H) { h = H; w = H * r; }
  img.style.width = Math.max(40, w) + 'px'; img.style.height = Math.max(40, h) + 'px';
}

// ---------- 编辑操作（可撤销） ----------
function targetIds() {
  if (S.view === 'compare') { const id = compareIds()[S.cmpFocus]; return id ? [id] : []; }
  if (S.view === 'single') return S.focus != null ? [S.focus] : [];
  return S.sel.size ? [...S.sel] : (S.focus != null ? [S.focus] : []);
}
const snap = p => ({ rating: p.rating, flag: p.flag, labels: [...p.labels] });
function restore(p, s) { p.rating = s.rating; p.flag = s.flag; p.labels = new Set(s.labels); }
function change(ids, mutate, label) {
  if (!ids.length) return;
  const before = ids.map(id => [id, snap(P[id])]);
  ids.forEach(id => mutate(P[id]));
  const after = ids.map(id => [id, snap(P[id])]);
  S.undo.push({ kind: 'photo', before, after, label }); S.redo = [];
  afterPhotoChange(ids);
  toast(`${label}${ids.length > 1 ? `（${ids.length} 张）` : ''}`);
  maybeAdvance(ids);
}
function afterPhotoChange(ids) {
  ids.forEach(patchCell); syncSelClasses();
  renderFilterbar(); renderInspector();
  if (S.view === 'single') { S.barUntil = Date.now() + 1500; renderSingle(); }
  if (S.view === 'compare') renderCompare();
}
function maybeAdvance(ids) {
  if (!S.autoAdvance || ids.length !== 1 || S.view === 'compare') return;
  move(1);
}
function setRating(ids, n) { change(ids, p => p.rating = n, n ? `★${n}` : '清除星级'); }
function setFlag(ids, f) { change(ids, p => p.flag = f, f === 'pick' ? 'Pick' : f === 'reject' ? 'Reject' : '清除标记'); }
function toggleLabel(ids, labelId) {
  const l = labelById(labelId);
  if (!l || !l.name) { toast('这个标签位还没有名字：在「图库 → 标签设置…」里定义'); return; }
  const all = ids.every(id => P[id].labels.has(labelId));
  change(ids, p => all ? p.labels.delete(labelId) : p.labels.add(labelId), `${all ? '去掉' : '加上'}标签「${l.name}」`);
}
function clearLabels(ids) { change(ids, p => p.labels.clear(), '清除所有标签'); }
function undo() {
  const op = S.undo.pop(); if (!op) return toast('没有可撤销的操作');
  applyOp(op, true); S.redo.push(op); toast('撤销：' + op.label);
}
function redo() {
  const op = S.redo.pop(); if (!op) return toast('没有可重做的操作');
  applyOp(op, false); S.undo.push(op); toast('重做：' + op.label);
}
function applyOp(op, isUndo) {
  if (op.kind === 'photo') { (isUndo ? op.before : op.after).forEach(([id, s]) => P[id] && restore(P[id], s)); afterPhotoChange(op.before.map(x => x[0]).filter(id => P[id])); }
  else if (op.kind === 'coll') {
    const c = collById(op.collId); if (!c) return;
    const add = op.add !== isUndo;
    op.ids.forEach(id => add ? c.ids.add(id) : c.ids.delete(id));
    if (S.source.type === 'coll' && S.source.id === c.id) { recompute(); renderGrid(); renderView(); }
    renderAll();
  }
}

// ---------- 收藏夹 ----------
function addToCollection(collId, ids) {
  const c = collById(collId); if (!c || !ids.length) return;
  const added = ids.filter(id => !c.ids.has(id));
  added.forEach(id => c.ids.add(id));
  S.lastColl = c.id;
  S.undo.push({ kind: 'coll', collId: c.id, ids: added, add: true, label: `加入「${c.name}」` }); S.redo = [];
  toast(`已将 ${ids.length} 张加入「${c.name}」${added.length < ids.length ? `（其中 ${ids.length - added.length} 张原本就在）` : ''}；之后按 B 继续加入这里`);
  renderSidebar(); renderInspector();
}
function removeFromCollection() {
  if (S.source.type !== 'coll') return;
  const c = collById(S.source.id); const ids = [...S.sel].filter(id => c.ids.has(id));
  if (!ids.length) return;
  ids.forEach(id => c.ids.delete(id));
  S.undo.push({ kind: 'coll', collId: c.id, ids, add: false, label: `移出「${c.name}」` }); S.redo = [];
  toast(`已从「${c.name}」移出 ${ids.length} 张；照片本身不受影响（⌘Z 撤销）`);
  const idx = S.result.indexOf(ids[0]);

  const nf = S.result[Math.min(idx, S.result.length - 1)];

  renderAll(); renderGrid(); renderView();
}
function suggestCollName() {

  else parts.push(sourceTitle());

  if (f.stars.size) parts.push(f.starMode === 'gte' ? `${[...f.stars][0]}星+` : [...f.stars].map(n => n + '星').join('/'));
  return parts.join(' · ');
}
async function newCollectionFlow(ids) {

}
function addToCollectionDialog() {

  const list = collections.map(c => `<div class="collrow ${c.id === S.lastColl ? 'last' : ''}" data-c="${c.id}"><span>📁 ${esc(c.name)}</span><span class="muted">${c.ids.size} 张${c.id === S.lastColl ? ' · 上次用过（B）' : ''}</span></div>`).join('');
  openModal(`<div class="mh">把 ${ids.length} 张照片加入收藏夹</div>
    <div class="mb">${list || '<div class="muted">还没有收藏夹。</div>'}
    <div class="fieldset" style="margin-top:12px"><div class="t">或新建一个</div><div style="display:flex;gap:6px"><input id="ncName" style="flex:1" value="${esc(suggestCollName())}"><button class="btn primary" id="ncOk">新建并加入</button></div></div></div>
    <div class="mf"><button class="btn" data-close>取消</button></div>`, m => {

function focusOnly(id) { S.focus = S.anchor = id; S.sel = new Set([id]); }
function move(offset) {

// ---------- 键盘：所有单键动作只在这里定义一次 ----------
const KEYMAP = [
  ['← →', '上一张 / 下一张（比较视图里切换焦点格）'], ['↑ ↓', '网格中换行'],
  ['1–5、0', '设置星级 / 清除星级'], ['6–9', '切换前四个标签（再按一次取消）'], ['⌥1–⌥9、⌥0', '切换第 1–9 个标签 / 清除所有标签'],
  ['P / X / U', 'Pick / Reject / 清除标记'], ['⇧P', '两张比较时：焦点格 Pick、另一张 Reject'],
  ['⇪ Caps Lock', '自动前进：打星、打标签、标记后自动跳到下一张'],
  ['空格', '网格 ↔ 单张'], ['C', '比较所选 2–4 张'], ['Esc', '退出专注模式 / 回到网格'], ['Z', '放大到 100%'], ['I', '单张视图的参数浮层'],
  ['F', '专注模式：单张、比较时隐藏侧栏、检查器、工具栏'], ['\\', '显示 / 隐藏筛选条'],
  ['B', '加入上一次用过的收藏夹'], ['⇧B', '加入收藏夹…（选择或新建）'], ['⌫', '在收藏夹里：移出收藏夹'],
  ['⌘A', '全选当前结果'], ['⌘Z / ⇧⌘Z', '撤销 / 重做'], ['⌘E', '导出…'], ['⌘F', '聚焦搜索框'], ['?', '显示这张速查表'],
];
function updateCaps(e) {
  if (typeof e.getModifierState !== 'function') return;
  const on = e.getModifierState('CapsLock');
  if (on !== S.autoAdvance) { S.autoAdvance = on; renderStatus(); toast(on ? '自动前进：开（打完自动跳下一张）' : '自动前进：关'); }
}
document.addEventListener('keyup', updateCaps);
document.addEventListener('keydown', e => {
  updateCaps(e);
  if ($('#modal-root').firstChild) { if (e.key === 'Escape') closeModal(); return; }
  hideCtx();
  const tag = document.activeElement?.tagName;
  const inInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  const meta = e.metaKey || e.ctrlKey;
  if (meta) {
    const k = e.key.toLowerCase();
    if (k === 'f') { e.preventDefault(); $('#search').focus(); $('#search').select(); return; }
    if (inInput) return;
    if (k === 'a') { e.preventDefault(); S.sel = new Set(S.result); syncSelClasses(); renderInspector(); renderStatus(); toast(`已全选 ${S.result.length} 张`); }
    else if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (k === 'e') { e.preventDefault(); exportDialog(); }
    return;
  }
  if (inInput) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (isStubSource()) return;
  if (e.altKey) {
    const m = e.code.match(/^Digit(\d)$/);
    if (m) { e.preventDefault(); const n = +m[1]; n === 0 ? clearLabels(targetIds()) : toggleLabel(targetIds(), labels[n - 1].id); }
    return;
  }
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); move(k === 'ArrowRight' ? 1 : -1); return; }
  if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); moveRow(k === 'ArrowDown' ? 1 : -1); return; }
  if (/^[0-5]$/.test(k)) { setRating(targetIds(), +k); return; }
  if (/^[6-9]$/.test(k)) { toggleLabel(targetIds(), labels[+k - 6].id); return; }
  switch (k) {
    case 'p': setFlag(targetIds(), 'pick'); break;
    case 'P': if (S.view === 'compare' && compareIds().length === 2) { const ids = compareIds(); const w = ids[S.cmpFocus], l = ids[1 - S.cmpFocus];
        const before = ids.map(id => [id, snap(P[id])]); P[w].flag = 'pick'; P[l].flag = 'reject';
        S.undo.push({ kind: 'photo', before, after: ids.map(id => [id, snap(P[id])]), label: `${P[w].name} Pick、${P[l].name} Reject` }); S.redo = []; afterPhotoChange(ids); toast(`${P[w].name} Pick，${P[l].name} Reject`); }
      else setFlag(targetIds(), 'pick'); break;
    case 'x': case 'X': setFlag(targetIds(), 'reject'); break;
    case 'u': case 'U': setFlag(targetIds(), 'none'); break;
    case ' ': e.preventDefault(); setView(S.view === 'grid' ? 'single' : 'grid'); break;
    case 'c': case 'C': setView('compare'); break;
    case 'Escape': if (S.focusMode) setFocusMode(false); else setView('grid'); break;
    case 'f': case 'F': if (S.view !== 'grid') setFocusMode(); else toast('专注模式用于单张和比较视图'); break;
    case '\\': toggleFilterbar(); break;
    case 'z': case 'Z': if (S.view !== 'grid') {
        if (!S.zoom && S.view === 'single') {
          const p = P[S.focus]; const loc = presentLocs(p).find(l => volById(l.vol).online && isGone(p, l.vol));
          if (loc) { const name = volById(loc.vol).name; const orphaned = discoveredGone(loc.vol, [p.id]);
            toast(`原片已不在「${name}」上：位置改为历史${orphaned ? '，这张照片已没有现存位置，移到「无卷关联照片」' : ''}`); if (orphaned) break; }
        }
        S.zoom = !S.zoom; renderView(); } break;
    case 'i': case 'I': if (S.view === 'single') { S.info = !S.info; renderSingle(); } break;
    case 'b': if (S.lastColl && collById(S.lastColl)) addToCollection(S.lastColl, targetIds()); else addToCollectionDialog(); break;
    case 'B': addToCollectionDialog(); break;
    case 'Backspace': case 'Delete': if (S.source.type === 'coll') removeFromCollection(); else toast('常规列表里没有删除照片：照片会在所在的卷被移除后进入「无卷关联照片」'); break;
    case '?': showKeys(); break;
  }
});

// ---------- 搜索 ----------
const LENS_TOKENS = ['24-70', '70-200', '16-35', '35mm'];
function parseSearch(q) {
  const toks = q.trim().split(/\s+/).filter(Boolean);
  return toks.map(t => {
    const lens = LENS_TOKENS.find(x => t.toLowerCase() === x.toLowerCase());
    if (lens) return { label: `镜头：${t}`, test: p => p.lens.includes(lens) };
    let m;
    if ((m = t.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/))) {
      const pre = `${m[1]}-${m[2].padStart(2, '0')}${m[3] ? '-' + m[3].padStart(2, '0') : ''}`;
      return { label: `日期：${pre}`, test: p => dayKey(p.ts).startsWith(pre) };
    }
    if ((m = t.match(/^(\d{1,2})月(?:(\d{1,2})日?)?$/))) {
      const mm = m[1].padStart(2, '0'), dd = m[2] ? m[2].padStart(2, '0') : null;
      return { label: `日期：${+mm} 月${dd ? +dd + ' 日' : ''}`, test: p => { const k = dayKey(p.ts); return k.slice(5, 7) === mm && (!dd || k.slice(8) === dd); } };
    }
    // 编号放在日期之后判断，否则 2026-08 会被当成编号范围。
    if ((m = t.match(/^(?:DSC)?0*(\d{1,5})(?:-0*(\d{1,5}))?(?:\.\w+)?$/i))) {
      const a = +m[1], b = m[2] ? +m[2] : a;
      return { label: m[2] ? `编号 ${a}–${b}` : `编号 ${a}`, test: p => p.no >= Math.min(a, b) && p.no <= Math.max(a, b) };
    }
    const lab = labels.find(l => l.name && l.name === t);
    if (lab) return { label: `标签：${t}`, test: p => p.labels.has(lab.id) };
    if (PEOPLE.includes(t)) return { label: `人物：${t}`, test: p => p.people.includes(t) };
    if (/a7|ilce|sony/i.test(t)) return { label: `相机：${t}`, test: p => true };
    if (photos.some(p => p.place.includes(t))) return { label: `地点：${t}`, test: p => p.place.includes(t) };
    return { label: `文字：${t}`, test: p => p.name.toLowerCase().includes(t.toLowerCase()) };
  });
}
$('#search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value; if (!q.trim()) return;
  S.search = parseSearch(q); e.target.value = ''; e.target.blur();
  S.filters['search:'] = emptyFilter();
  setSource({ type: 'search', id: null });
});

    <div class="fieldset"><div class="t">文件</div>
      <label class="opt"><input type="radio" name="k" value="raw">只导出 RAW（没有 RAW 的导出 JPEG）</label>
      <label class="opt"><input type="radio" name="k" value="jpg">只导出 JPEG（没有 JPEG 的导出 RAW）</label>
      <label class="opt"><input type="radio" name="k" value="both" checked>两者都要</label></div>
    <div class="fieldset"><div class="t">目录结构</div>

      <label class="opt"><input type="radio" name="d" value="coll">按收藏夹分子文件夹</label>
      <label class="opt"><input type="radio" name="d" value="orig">保持原目录</label></div>
    <div class="fieldset"><div class="t">目标</div><div style="display:flex;gap:6px"><input value="~/Pictures/精修" style="flex:1"><button class="btn">选择…</button></div>
      <div class="muted" style="margin-top:4px">只复制，不改动原文件；目标已有同名文件时自动改名，绝不覆盖。</div></div>
    <div class="fieldset" id="exNeed"></div></div>
    <div class="mf"><button class="btn" data-close>取消</button><button class="btn primary" id="exOk">导出</button></div>`, m => {
    const ids = () => { const r = m.querySelector('input[name=r]:checked').value;
      if (r === 'sel') return [...S.sel]; if (r === 'result') return [...S.result];
      const c = collById(+m.querySelector('#exColl').value); return c ? [...c.ids].filter(id => P[id] && visible(P[id])) : []; };
    // 用户在面板里的选择要保持：每次刷新前先读回“跳过离线卷”的勾选状态。
    let skip = true;

      const list = ids().map(id => P[id]);
      const vols = {}; let offline = 0;
      list.forEach(p => { const on = presentLocs(p).filter(l => volById(l.vol).online); if (on.length) vols[on[0].vol] = (vols[on[0].vol] || 0) + 1; else { offline++; const l = presentLocs(p)[0]; if (l) vols[l.vol + '!'] = (vols[l.vol + '!'] || 0) + 1; } });
      return { list, vols, offline };
    };
    const update = () => {
      const prev = m.querySelector('#exSkip'); if (prev) skip = prev.checked;
      const { list, vols, offline } = plan();
      m.querySelector('#exNeed').innerHTML = `<div class="t">需要的卷</div>${Object.entries(vols).map(([k, n]) => { const off = k.endsWith('!'); const v = volById(k.replace('!', ''));
        return `<div class="loc"><span class="dot ${off ? 'offline' : 'online'}" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>${esc(v.name)} · ${n} 张${off ? ' <span style="color:var(--warn)">离线，请插入</span>' : ''}</div>`; }).join('') || '<div class="muted">—</div>'}
        ${offline ? `<label class="opt"><input type="checkbox" id="exSkip" ${skip ? 'checked' : ''}>跳过离线卷上的 ${offline} 张，只导出在线的 ${list.length - offline} 张</label>` : ''}`;
      m.querySelector('#exOk').textContent = offline && !skip ? `插入离线卷后导出 ${list.length} 张` : `导出 ${list.length - offline} 张`;
    };
    m.addEventListener('change', update); update();
    m.querySelector('#exOk').onclick = () => {
      const { list, offline } = plan();
      if (offline && !skip) { toast('还有照片只在离线卷上：插入列出的卷后再导出，或勾选“跳过离线卷”'); return; }
      // 每个文件依次尝试所有在线位置；读不到的位置改为历史，都读不到才算失败。
      let done = 0; const failed = []; const goneBy = {};
      list.forEach(p => {
        const cands = presentLocs(p).filter(l => volById(l.vol).online);
        if (!cands.length) return;

    };
  });
}

// ---------- 卷：清卡检查、移除、改名 ----------
function clearCardCheck(v) {
  const ps = photos.filter(p => visible(p) && p.locations.some(l => l.vol === v.id && isPresent(l)));
  // 按文件核对：卡上每个文件归入“已核实 / 只有离线记录 / 缺副本”之一。
  // 在线卷上的副本当场确认还在（原型里查 goneOnDisk），发现不在的顺手改为历史位置。
  const goneCopies = {};
  ps.forEach(p => p.locations.filter(l => isPresent(l) && l.vol !== v.id && volById(l.vol).online && isGone(p, l.vol))
    .forEach(l => (goneCopies[l.vol] ??= []).push(p.id)));
  const goneN = Object.values(goneCopies).reduce((a, b) => a + b.length, 0);
  Object.entries(goneCopies).forEach(([vid, ids]) => markGone(vid, ids));
  let files = 0, verified = 0, offlineOnly = 0, missing = 0;
  const missingPhotos = [], offlineVols = new Set();
  ps.forEach(p => {
    const here = new Set(p.locations.filter(l => l.vol === v.id && isPresent(l)).flatMap(l => locParts(l, p)));
    const lack = [];
    here.forEach(k => {
      files++;
      const copies = p.locations.filter(l => l.vol !== v.id && isPresent(l) && locParts(l, p).includes(k));
      if (copies.some(l => volById(l.vol).online)) verified++;
      else if (copies.length) { offlineOnly++; copies.forEach(l => offlineVols.add(volById(l.vol).name)); }
      else { missing++; lack.push(k); }
    });
    if (lack.length) missingPhotos.push([p, lack]);
  });
  const rawOnly = missingPhotos.filter(([, lack]) => lack.length === 1 && lack[0] === 'RAW').length;
  const pending = ps.filter(p => p.preview !== 'done').length;
  const allClear = missing === 0 && offlineOnly === 0 && pending === 0;
  const nc = missingPhotos.map(([p]) => p);
  const important = p => p.rating > 0 || p.flag === 'pick' || inAnyColl(p);
  const imp = nc.filter(important);
  let onlyImp = imp.length > 0;
  openModal(`<div class="mh">清卡检查：${esc(v.name)}</div><div class="mb">
    <div>${ps.length.toLocaleString()} 张照片、${files.toLocaleString()} 个文件（按文件核对，RAW 和 JPEG 分开）：</div>
    ${goneN ? `<div class="loc" style="color:var(--warn)">核对时发现 ${goneN} 张照片在其他卷上的副本已经不在，已按缺副本计算</div>` : ''}
    <div class="loc">✅ ${verified.toLocaleString()} 个文件已核实：在线卷上有副本，刚确认还在</div>
    ${offlineOnly ? `<div class="loc">☑️ ${offlineOnly.toLocaleString()} 个文件只有离线记录：副本在「${[...offlineVols].map(esc).join('、')}」上，按上次扫描结果，没法当场核对；插上后再检查一次</div>` : ''}
    ${missing ? `<div class="loc">⚠️ <b>${missing.toLocaleString()}</b> 个文件缺副本，涉及 ${nc.length.toLocaleString()} 张照片${rawOnly ? `（其中 ${rawOnly} 张缺的是 RAW：别处只有 JPEG）` : ''}；其中 ${nc.filter(p => p.rating > 0).length} 张已打星、${nc.filter(p => p.flag === 'pick').length} 张已 Pick、${nc.filter(inAnyColl).length} 张在收藏夹里</div>` : ''}
    ${pending ? `<div class="loc">⏳ ${pending.toLocaleString()} 张照片的离线预览还没生成完：现在移除，它们在本机只剩缩略图甚至没有预览</div>` : ''}
    ${allClear ? '<p><b>所有文件都已核实、预览都已就绪，可以清空这张卡。</b></p>' : ''}
    ${nc.length ? `<label class="opt" style="margin-top:8px"><input type="checkbox" id="onlyImp" ${onlyImp ? 'checked' : ''}>只看已打星 / Pick / 在收藏夹里的</label><div class="minigrid" id="ncGrid"></div>` : ''}
    <p class="muted">移除卷只影响软件里的记录：照片、星级、标签、收藏夹和预览都保留；别处一个副本都没有的照片会从常规列表隐藏，进入「无卷关联照片」。卡上的文件不会被动。</p></div>
    <div class="mf">${nc.length ? `<button class="btn left" id="copyNc" ${v.online ? '' : 'disabled title="卷离线，插上后才能复制"'}>补副本到…</button>` : ''}<button class="btn" data-close>关闭</button><button class="btn ${allClear ? 'primary' : 'danger'}" id="rmV">${allClear ? '移除卷…' : '仍然移除卷…'}</button></div>`, m => {
    const lackOf = new Map(missingPhotos.map(([p, lack]) => [p.id, lack]));
    const draw = () => { const g = m.querySelector('#ncGrid'); if (!g) return; const all = onlyImp ? imp : nc; const list = all.slice(0, 160);
      g.innerHTML = list.map(p => `<div class="mc" style="width:${Math.round(54 * p.w / p.h)}px;background:${phStyle(p)}" title="${p.name} 缺 ${lackOf.get(p.id).map(partName).join(' + ')}">${badges(p, true)}${lackOf.get(p.id).length === 1 && partsOf(p).length === 2 ? `<span class="b kind">缺 ${partName(lackOf.get(p.id)[0])}</span>` : ''}</div>`).join('') + (all.length > 160 ? `<span class="muted">… 还有 ${all.length - 160} 张</span>` : ''); };
    draw();
    const oi = m.querySelector('#onlyImp'); if (oi) oi.onchange = () => { onlyImp = oi.checked; draw(); };
    const cp = m.querySelector('#copyNc');
    if (cp) cp.onclick = () => {
      const targets = volumes.filter(x => x.status === 'active' && x.id !== v.id && x.online);
      if (!targets.length) return toast('没有其他在线的卷可以复制过去');
      const t = targets[0];
      // 补副本：保留原文件名，同一张照片的文件放同一目录；目标有同名文件时换新子目录（原型不模拟冲突）。
      // 源文件读不到的不登记、单独报告，并把源位置改为历史。复制校验通过后才登记副本。
      const ok = [], failed = [];
      missingPhotos.forEach(([p, lack]) => {
        if (isGone(p, v.id)) { failed.push(p); return; }
        p.locations.push({ vol: t.id, path: `${t.root}/补副本-2026-11-19/${p.name}`, status: 'present', parts: lack });
        ok.push([p, lack]);
      });
      if (failed.length) markGone(v.id, failed.map(p => p.id));
      const nFiles = ok.reduce((a, [, lack]) => a + lack.length, 0);
      closeModal();
      toast(`补副本到「${t.name}」：${nFiles} 个文件复制并校验通过，已重扫登记${failed.length ? `；${failed.length} 张的源文件已读不到（${failed.map(p => p.name).join('、')}），没有登记，源位置改为历史` : ''}（原型）`);
      recompute(); renderAll(); renderGrid(); renderView(); clearCardCheck(v);
    };
    m.querySelector('#rmV').onclick = () => { closeModal(); removeVolumeFlow(v); };
  }, true);
}
async function removeVolumeFlow(v) {
  const ps = photos.filter(p => visible(p) && p.locations.some(l => l.vol === v.id && isPresent(l)));
  const nc = ps.filter(p => noOtherCopy(p, v.id)).length;
  const partial = ps.filter(p => !noOtherCopy(p, v.id) && missingParts(p, v.id).length).length;
  const ok = await confirmBox(`移除卷「${v.name}」？`,
    `<p>通常是这张卡已经清空或准备清空。</p>
     <p>· ${ps.length - nc} 张在其他卷上有副本：照常显示${partial ? `（其中 <b>${partial}</b> 张只有部分文件有副本，比如缺 RAW）` : ''}。<br>· <b>${nc}</b> 张没有其他副本：从常规列表和搜索中隐藏，进入「图库 → 无卷关联照片…」，预览、星级、标签、收藏夹都保留。</p>
     <p class="muted">卡上的文件不会被动。以后再插上这张卡会被当作新卷，没删掉的照片会对回原来的记录。</p>`, '移除卷', true);
  if (!ok) return;
  v.status = 'removed'; v.removedAt = '今天';
  photos.forEach(p => p.locations.forEach(l => { if (l.vol === v.id) l.status = 'historical'; }));
  toast(`已移除「${v.name}」；${nc} 张照片进入「无卷关联照片」`);
  if (S.source.type === 'vol' && S.source.id === v.id) setSource({ type: 'all' });
  else { recompute(); renderAll(); renderGrid(); renderView(); }
}
async function renameVolume(v) { const n = await askText('卷名', v.name); if (n) { v.name = n; renderAll(); } }

// ---------- 原片被手动删除（模拟） ----------
// 软件平时只看卷有没有挂载，不逐个检查原片，所以在 Finder 里删掉原片后，软件暂时不知道。
// 发现的时机只有三个：重新扫描（含卷插上时的自动重扫）、导出或 100% 放大时读不到、清卡检查现场核对副本。
const goneOnDisk = new Map(); // volId → Set(photoId)，只有“磁盘”知道，软件不知道
const isGone = (p, volId) => goneOnDisk.get(volId)?.has(p.id) ?? false;
function simulateFinderDelete(v) {
  const cands = S.result.map(id => P[id]).filter(p => p.locations.some(l => l.vol === v.id && isPresent(l)) && !isGone(p, v.id));
  const picked = cands.slice(0, 5);
  if (!picked.length) return toast('当前结果里没有可删的照片');
  if (!goneOnDisk.has(v.id)) goneOnDisk.set(v.id, new Set());
  picked.forEach(p => goneOnDisk.get(v.id).add(p.id));
  toast(`（模拟）已在 Finder 里删掉 ${picked.map(p => p.name).join('、')}：软件还不知道，照常显示`);
}
// 把读不到原片的位置改成历史位置，返回其中因此变成无卷关联的张数。
function markGone(volId, ids) {
  let orphaned = 0;
  ids.forEach(id => { const p = P[id]; if (!p) return; p.locations.forEach(l => { if (l.vol === volId) l.status = 'historical'; }); if (!visible(p)) orphaned++; });
  goneOnDisk.get(volId)?.forEach(id => ids.includes(id) && goneOnDisk.get(volId).delete(id));
  return orphaned;
}
// 读原片时发现不在（导出、100% 放大）：改为历史位置，重新筛选，焦点落到邻近的照片上。
function discoveredGone(volId, ids) {
  const prev = S.focus, idx = S.result.indexOf(prev);
  const orphaned = markGone(volId, ids);
  recompute();
  if (prev != null && !S.result.includes(prev)) { const nf = S.result[Math.min(Math.max(idx, 0), S.result.length - 1)]; if (nf != null) focusOnly(nf); }
  renderAll(); renderGrid(); renderView();
  return orphaned;
}
function rescanVolume(v, quiet) {
  if (!v.online) return toast('卷离线，插上后才能扫描');
  const gone = [...(goneOnDisk.get(v.id) || [])].filter(id => P[id]?.locations.some(l => l.vol === v.id && l.status === 'present'));
  v.lastScan = '刚刚';
  if (!gone.length) { if (!quiet) toast(`已重新扫描「${v.name}」：没有新增、变化或消失的文件`); renderHead(); return; }
  const orphaned = markGone(v.id, gone);
  toast(`重新扫描「${v.name}」：${gone.length} 张原片已不在，位置改为历史${orphaned ? `；其中 ${orphaned} 张没有其他副本，移到「无卷关联照片」` : '；它们在别的卷上还有副本，照常显示'}。星级、标签、预览都保留`);
  recompute(); renderAll(); renderGrid(); renderView();
}

// ---------- 无卷关联照片 ----------
function orphanWindow() {
  const orphans = photos.filter(p => !visible(p));
  const groups = {};
  orphans.forEach(p => { const l = p.locations[p.locations.length - 1]; const k = l ? l.vol : '?'; (groups[k] ??= []).push(p); });
  const sel = new Set();
  openModal(`<div class="mh">无卷关联照片</div><div class="mb">
    <p class="muted">这些照片所在的卷都已移除，或重扫时文件已经不在。它们不出现在常规列表、搜索和收藏夹里，但预览、星级、标签都还在。<br>在这里删除会真正删掉照片记录和预览，<b>卡和盘上的文件不受影响</b>；以后再扫到同一张照片，会作为新照片导入。</p>
    ${orphans.length ? Object.entries(groups).map(([vid, list]) => { const v = volById(vid);
      return `<div class="ogroup"><div class="oh"><b>${esc(v ? v.name : '未知卷')}</b><span class="muted">${v?.removedAt ? '移除于 ' + v.removedAt + ' · ' : ''}${list.length} 张 · 其中 ${list.filter(p => p.rating > 0).length} 张已打星、${list.filter(p => p.flag === 'pick').length} 张 Pick、${list.filter(inAnyColl).length} 张在收藏夹里</span><span style="flex:1"></span><button class="btn" data-gsel="${vid}">全选本组</button></div>
        <div class="minigrid">${list.map(p => `<div class="mc" data-oid="${p.id}" style="width:${Math.round(54 * p.w / p.h)}px;background:${phStyle(p)}" title="${p.name} · ${dayKey(p.ts)}">${badges(p, true)}</div>`).join('')}</div></div>`; }).join('') : '<p>没有无卷关联的照片。</p>'}
    </div><div class="mf"><span class="muted left" id="oCount">未选择</span><button class="btn" data-close>关闭</button><button class="btn danger" id="oDel" disabled>删除所选…</button></div>`, m => {
    const sync = () => { m.querySelectorAll('.mc[data-oid]').forEach(c => c.classList.toggle('sel', sel.has(+c.dataset.oid))); m.querySelector('#oCount').textContent = sel.size ? `已选 ${sel.size} 张` : '未选择'; m.querySelector('#oDel').disabled = !sel.size; };
    m.querySelectorAll('.mc[data-oid]').forEach(c => c.onclick = e => { const id = +c.dataset.oid; if (!(e.metaKey || e.shiftKey)) { if (!sel.has(id) || sel.size > 1) { sel.clear(); sel.add(id); } else sel.delete(id); } else sel.has(id) ? sel.delete(id) : sel.add(id); sync(); });
    m.querySelectorAll('[data-gsel]').forEach(b => b.onclick = () => { groups[b.dataset.gsel].forEach(p => sel.add(p.id)); sync(); });
    m.querySelector('#oDel').onclick = async () => {
      const ids = [...sel].filter(id => P[id] && !visible(P[id])); const n = ids.length;
      const ok = await confirmBox(`删除 ${n} 张照片的记录和预览？`, '<p>删除后无法撤销。卡和盘上的源文件不受影响。</p>', `删除 ${n} 张`, true);
      if (!ok) return orphanWindow();
      // 确认时按当时的状态再核对一次：期间被重扫找回的照片不删。
      ids.filter(id => P[id] && !visible(P[id])).forEach(id => { const p = P[id]; photos.splice(photos.indexOf(p), 1); delete P[id]; collections.forEach(c => c.ids.delete(id)); });
      // 已移除的卷不再有任何照片时，一并删除。
      volumes.filter(v => v.status === 'removed' && !photos.some(p => p.locations.some(l => l.vol === v.id))).forEach(v => volumes.splice(volumes.indexOf(v), 1));
      S.undo = S.undo.filter(op => op.kind !== 'photo' || op.before.every(([id]) => P[id]));
      toast(`已删除 ${n} 张照片的记录和预览`); renderAll(); orphanWindow();
    };
  }, true);
}

// ---------- 插卡导入（模拟） ----------

      <div class="muted" style="margin-top:4px">存储卡默认 DCIM；外置盘每次手动选。</div></div>
      <p class="muted">导入只建索引、生成预览，不复制原文件，也不改动卡上的任何东西。</p></div>
      <div class="mf"><button class="btn" data-close>取消</button><button class="btn primary" id="vOk">开始导入</button></div>`, m => {
      m.querySelector('#vOk').onclick = () => { const name = m.querySelector('#vName').value.trim() || '新卡'; const root = m.querySelector('#vRoot').value.trim() || 'DCIM'; closeModal(); startImport(name, root); };
    });
  };
}
function startImport(name, root) {
  volumes.push({ id: 'E', name, kind: 'card', online: true, status: 'active', capacity: '64 GB', root, lastScan: '正在扫描' });
  const batch = batchSeq++;
  const total = 240;
  const all = genTrip({ vol: 'E', count: total, start: '2026-11-15', days: 3, places: ['北京 · 故宫', '北京 · 景山'], startNo: 9300, hues: [15, 45, 210], batch, trip: '2026-11 北京' });
  // 先从照片列表里拿出来，按批次放回，模拟“照片边扫边出现”。
  all.forEach(p => { photos.splice(photos.indexOf(p), 1); p.preview = 'pending'; p.people = []; });
  S.tasks = [{ name: '扫描', done: 0, total }, { name: '预览', done: 0, total }, { name: 'OCR', done: 0, total, paused: false }, { name: '人物', done: 0, total, paused: false }];
  setSource({ type: 'vol', id: 'E' });
  let scanned = 0, previewed = 0, ocr = 0, face = 0;
  const timer = setInterval(() => {
    if (scanned < total) { all.slice(scanned, scanned + 30).forEach(p => photos.push(p)); scanned = Math.min(total, scanned + 30); }
    if (previewed < scanned) { all.slice(previewed, previewed + 18).forEach(p => p.preview = 'done'); previewed = Math.min(scanned, previewed + 18); }
    const tO = S.tasks[2], tF = S.tasks[3];
    if (previewed === total && !tO.paused) ocr = Math.min(total, ocr + 40);
    if (previewed === total && !tF.paused) face = Math.min(total, face + 25);
    S.tasks[0].done = scanned; S.tasks[1].done = previewed; tO.done = ocr; tF.done = face;
    if (S.source.type === 'vol' && S.source.id === 'E') { const keep = S.focus; recompute(); if (keep) S.focus = keep; renderGrid(); renderHead(); renderFilterbar(); }
    renderSidebar(); renderStatus();
    if (scanned === total && previewed === total && ocr === total && face === total) {
      clearInterval(timer); volById('E').lastScan = '刚刚';
      all.forEach(p => { if (p.portrait && rnd() < 0.6) p.people = [pick(PEOPLE)]; });
      S.tasks = null; renderAll(); toast(`「${name}」导入完成：${total} 张，预览、OCR、人物识别都已完成`);
    }
  }, 450);
}
function taskPanel() {
  if (!S.tasks) return;
  openModal(`<div class="mh">后台任务</div><div class="mb">${S.tasks.map((t, i) => `<div class="opt" style="justify-content:space-between"><span><b>${t.name}</b> ${t.done}/${t.total}</span>${i >= 2 ? `<button class="btn" data-t="${i}">${t.paused ? '继续' : '暂停'}</button>` : '<span class="muted">选片时交互请求优先</span>'}</div>`).join('')}</div>
    <div class="mf"><button class="btn" data-close>关闭</button></div>`, m => {
    m.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = S.tasks?.[+b.dataset.t]; if (t) { t.paused = !t.paused; renderStatus(); taskPanel(); } });
  });
}

// ---------- 标签设置、快捷键 ----------
function labelSettings() {
  openModal(`<div class="mh">标签设置</div><div class="mb"><p class="muted">顺序决定快捷键：第 1–4 个对应 6–9，全部对应 ⌥1–⌥9。名字留空表示不用这个位置。删掉名字只会把这个标签从所有照片上去掉。</p>
    ${labels.map((l, i) => `<div class="labelrow"><span class="sw" data-c="${i}" style="background:${l.color}" title="点击换颜色"></span><input data-n="${i}" value="${esc(l.name)}" placeholder="（未使用）" style="flex:1"><span class="muted" style="width:70px">${i < 4 ? `<kbd>${i + 6}</kbd> ` : ''}<kbd>⌥${i + 1}</kbd></span></div>`).join('')}</div>
    <div class="mf"><button class="btn primary" id="lOk">完成</button></div>`, m => {
    m.querySelectorAll('[data-c]').forEach(s => s.onclick = () => { const l = labels[+s.dataset.c]; l.color = LABEL_PALETTE[(LABEL_PALETTE.indexOf(l.color) + 1) % LABEL_PALETTE.length]; s.style.background = l.color; });
    m.querySelector('#lOk').onclick = () => {
      m.querySelectorAll('[data-n]').forEach(inp => { const l = labels[+inp.dataset.n]; const n = inp.value.trim(); if (!n && l.name) photos.forEach(p => p.labels.delete(l.id)); l.name = n; });
      Object.values(S.filters).forEach(f => [...f.labels].forEach(id => { if (!labelById(id).name) f.labels.delete(id); }));
      closeModal(); renderAll(); renderGrid(); renderView();
    };
  });
}
function showKeys() {
  openModal(`<div class="mh">快捷键</div><div class="mb"><table class="keys">${KEYMAP.map(([k, a]) => `<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(a)}</td></tr>`).join('')}</table>
    <p class="muted">原型在浏览器里运行：⌘1–⌘3 等组合会被浏览器占用，视图切换请用空格、C 或工具栏。文本框获得焦点时，单键快捷键让位给输入。</p></div>
    <div class="mf"><button class="btn primary" data-close>好</button></div>`);
}

// ---------- 菜单栏 ----------
const MENUS = [
  ['<b>PhotoAI</b>', [['关于这个原型', () => openModal(`<div class="mh">PhotoAI v2 原型</div><div class="mb"><p>可点击原型，只模拟界面和交互：照片是生成的色块，数据只在内存里，刷新页面即重置。</p><p>右下角的「走查清单」是要验证的问题，走一遍后把意见告诉 Claude。</p></div><div class="mf"><button class="btn primary" data-close>好</button></div>`)]]],
  ['文件', [['（原型）模拟插入一张新卡', simulateInsert], null, ['导出…', () => exportDialog(), '⌘E']]],
  ['图库', [['无卷关联照片…', orphanWindow], null, ['标签设置…', labelSettings], ['新建收藏夹…', () => newCollectionFlow([])]]],
  ['照片', [['加入收藏夹…', addToCollectionDialog, '⇧B'], ['全选当前结果', () => { S.sel = new Set(S.result); syncSelClasses(); renderInspector(); renderStatus(); }, '⌘A'], null, ['撤销', undo, '⌘Z'], ['重做', redo, '⇧⌘Z']]],
  ['显示', [['网格', () => setView('grid'), '空格'], ['单张', () => setView('single'), '空格'], ['比较', () => setView('compare'), 'C'], null, ['显示 / 隐藏检查器', () => $('#inspBtn').click()]]],
  ['帮助', [['快捷键…', showKeys, '?'], ['走查清单', () => { $('#checklist').classList.remove('min', 'hidden'); }]]],
];
function renderMenubar() {
  $('#menubar').innerHTML = MENUS.map(([t, items], i) => `<div class="m" data-m="${i}">${t}<div class="drop">${items.map((it, j) => it ? `<div class="it" data-mi="${i}:${j}"><span>${esc(it[0])}</span><span class="muted">${it[2] || ''}</span></div>` : '<hr>').join('')}</div></div>`).join('') + `<span class="proto">原型 · 数据只在内存里，刷新即重置</span>`;
}
$('#menubar').addEventListener('click', e => {
  const it = e.target.closest('.it');
  if (it) { const [i, j] = it.dataset.mi.split(':').map(Number); document.querySelectorAll('#menubar .m').forEach(m => m.classList.remove('open')); MENUS[i][1][j][1](); return; }
  const m = e.target.closest('.m'); if (!m) return;
  const was = m.classList.contains('open');
  document.querySelectorAll('#menubar .m').forEach(x => x.classList.remove('open'));
  if (!was) m.classList.add('open');
});

// ---------- 走查清单 ----------
const CHECKS = [
  '典型场景：卡 A → 时间倒序 → 空格进单张、打开 Caps Lock，边看边按 1–5 打星、6–9 打标签',
  '回到网格，在筛选条点「经典」「★5」，打星过程中结果是否保持不变、「刷新结果」是否顺手',
  '⌘A 全选 → ⇧B 新建收藏夹 → 在侧栏打开它，用 ⌫ 移出几张、再从别处按 B 补几张',
  '⌘E 导出：三个选择是否够用，离线卷的提示是否清楚',
  '比较：选 2–4 张按 C，← → 切焦点，打星，两张时试 ⇧P',
  '切换侧栏各项再切回来：筛选条件是否各自记住；切换视图后滚动位置和选择是否还在',
  '卷：备份盘 2 / 卡 B 的在线、离线；右键或卷信息条做清卡检查',
  '卡 A 清卡检查 → 复制缺副本照片或仍然移除 → 「图库 → 无卷关联照片…」里删除',
  '「文件 → 模拟插入一张新卡」：导入提示、照片边扫边出现、状态栏后台任务',
  '「图库 → 标签设置…」改标签名和颜色',
  '顶部只剩一行标题：按 \\ 或工具栏「筛选」收起筛选条，生效的条件会显示在标题行',
  '单张视图：没有顶部栏，信息条浮在底部、鼠标不动 2 秒后淡出；按 F 进入专注模式',
  '卡 A 标题行「⋯」→（原型）在 Finder 里删掉 5 张原片 → 导出或重新扫描，看软件怎么发现',
];
function renderChecklist() {
  let done = {}; try { done = JSON.parse(localStorage.getItem('photoai-proto-checks') || '{}'); } catch (e) { }
  const n = CHECKS.filter((_, i) => done[i]).length;
  $('#checklist').innerHTML = `<div class="ch"><span>走查清单 ${n}/${CHECKS.length}</span><span>▾</span></div><div class="cb">${CHECKS.map((c, i) => `<label><input type="checkbox" data-ck="${i}" ${done[i] ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}</div>`;
}
$('#checklist').addEventListener('click', e => {
  if (e.target.closest('.ch')) { $('#checklist').classList.toggle('min'); return; }
  const ck = e.target.closest('[data-ck]'); if (!ck) return;
  let done = {}; try { done = JSON.parse(localStorage.getItem('photoai-proto-checks') || '{}'); } catch (er) { }
  done[ck.dataset.ck] = ck.checked; try { localStorage.setItem('photoai-proto-checks', JSON.stringify(done)); } catch (er) { }
  const min = $('#checklist').classList.contains('min'); renderChecklist(); if (min) $('#checklist').classList.add('min');
});

// ---------- 启动 ----------
function renderAll() { renderSidebar(); renderHead(); renderFilterbar(); renderInspector(); renderStatus(); }
renderMenubar(); renderChecklist();
recompute(false);
renderAll(); renderGrid(); renderView();
</script>
